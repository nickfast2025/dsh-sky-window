# The local Windows browser works reliably with DSH's in-page directory browser.
# Override the web bundle's adaptive native chooser for this isolated dev profile.
- id: directory-picker
  disabled: true

- insert:
    - id: directory-picker-browse
      name: '@deepseek-ai/dsh-host-directory-picker-browse'

    - id: directory-picker-browse-ui
      name: '@deepseek-ai/dsh-client-ui-directory-picker-browse'
